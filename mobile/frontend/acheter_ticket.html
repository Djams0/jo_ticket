<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Acheter des Tickets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container" style="margin-top: 50px;">
  <h2 class="mb-4">Acheter des Tickets</h2>

  <div id="message" class="alert d-none"></div>
  <div id="qrCodesContainer" class="mt-4"></div>

  <form id="ticketForm" class="bg-dark text-white p-4 rounded">
    <div class="mb-3">
      <label class="form-label d-block">Silver (30.00 €)</label>
      <div class="input-group" style="max-width: 200px;">
        <button type="button" class="btn btn-outline-light" onclick="changerQuantite('silver', -1)">−</button>
        <input type="number" id="silver" class="form-control text-center" value="0" min="0" readonly>
        <button type="button" class="btn btn-outline-light" onclick="changerQuantite('silver', 1)">+</button>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label d-block">Gold (50.00 €)</label>
      <div class="input-group" style="max-width: 200px;">
        <button type="button" class="btn btn-outline-light" onclick="changerQuantite('gold', -1)">−</button>
        <input type="number" id="gold" class="form-control text-center" value="0" min="0" readonly>
        <button type="button" class="btn btn-outline-light" onclick="changerQuantite('gold', 1)">+</button>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label d-block">Platinum (100.00 €)</label>
      <div class="input-group" style="max-width: 200px;">
        <button type="button" class="btn btn-outline-light" onclick="changerQuantite('platinum', -1)">−</button>
        <input type="number" id="platinum" class="form-control text-center" value="0" min="0" readonly>
        <button type="button" class="btn btn-outline-light" onclick="changerQuantite('platinum', 1)">+</button>
      </div>
    </div>

    <div class="mt-4">
      <strong>Total billets : </strong><span id="totalBillets">0</span><br>
      <strong>Total à payer : </strong><span id="totalPrix">0.00 €</span>
    </div>

    <button type="submit" class="btn btn-primary mt-4">Valider l'achat</button>
    <a href="index.html" class="btn btn-secondary mt-4 ms-2">Retour à la liste</a>
  </form>
</div>

<script>
  const prix = {
    silver: 30.00,
    gold: 50.00,
    platinum: 100.00
  };

  const eventId = new URLSearchParams(window.location.search).get('event_id');
  const token = localStorage.getItem('token'); // Assure-toi que le token est bien stocké après login

  function changerQuantite(id, delta) {
    const input = document.getElementById(id);
    let val = parseInt(input.value) || 0;
    val = Math.max(0, val + delta);
    input.value = val;
    calculerTotal();
  }

  function calculerTotal() {
    let totalBillets = 0;
    let totalPrix = 0;
    for (let key in prix) {
      const val = parseInt(document.getElementById(key).value) || 0;
      totalBillets += val;
      totalPrix += val * prix[key];
    }
    document.getElementById("totalBillets").innerText = totalBillets;
    document.getElementById("totalPrix").innerText = totalPrix.toFixed(2) + " €";
  }

  document.getElementById('ticketForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const quantites = {
      silver: parseInt(document.getElementById('silver').value) || 0,
      gold: parseInt(document.getElementById('gold').value) || 0,
      platinum: parseInt(document.getElementById('platinum').value) || 0
    };

    const messageBox = document.getElementById('message');
    const qrCodesContainer = document.getElementById('qrCodesContainer');
    messageBox.className = 'alert d-none';
    qrCodesContainer.innerHTML = '';

    if (!eventId) {
      showError("ID de l'événement manquant.");
      return;
    }

    if (!token) {
      showError("Token d'accès manquant. Veuillez vous connecter.");
      return;
    }

    let ticketsEnvoyes = 0;
    const qrCodes = [];

    try {
      for (const categorie in quantites) {
        const quantite = quantites[categorie];
        const price = prix[categorie];
        for (let i = 0; i < quantite; i++) {
          const response = await fetch('http://localhost:3000/tickets', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
              event_id: eventId,
              category: categorie.charAt(0).toUpperCase() + categorie.slice(1),
              price: price
            })
          });

          if (response.status !== 201) {
            const errorText = await response.text();
            showError(`Erreur API: Code HTTP ${response.status}. Réponse: ${errorText}`);
            return;
          }

          const data = await response.json();
          if (data.qrCodeUrl) {
            qrCodes.push(data.qrCodeUrl);
            ticketsEnvoyes++;
          }
        }
      }

      if (ticketsEnvoyes > 0) {
        messageBox.className = 'alert alert-success';
        messageBox.innerText = `${ticketsEnvoyes} billet(s) acheté(s) avec succès.`;
        afficherQRCodes(qrCodes);
        setTimeout(() => {
          window.location.href = 'mes_tickets.html';
        }, 1200);
      } else {
        showError("Aucun billet n'a pu être acheté.");
      }
    } catch (error) {
      showError("Erreur de connexion : " + error.message);
    }
  });

  function showError(message) {
    const box = document.getElementById('message');
    box.className = 'alert alert-danger';
    box.innerText = message;
  }

  function afficherQRCodes(qrCodes) {
    const container = document.getElementById('qrCodesContainer');
    if (qrCodes.length > 0) {
      const title = document.createElement('h5');
      title.innerText = "QR Codes générés :";
      container.appendChild(title);

      const list = document.createElement('ul');
      qrCodes.forEach(url => {
        const li = document.createElement('li');
        const img = document.createElement('img');
        img.src = url;
        img.alt = "QR Code";
        img.style.maxWidth = '150px';
        li.appendChild(img);
        list.appendChild(li);
      });
      container.appendChild(list);
    }
  }
</script>
</body>
</html>
