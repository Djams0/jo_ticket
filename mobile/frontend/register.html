<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4" style="width: 350px;">
            <h2 class="text-center">Inscription</h2>
            <div id="message" class="alert alert-danger d-none"></div>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Nom d'utilisateur</label>
                    <input type="text" name="username" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
            </form>
            <div class="text-center mt-3">
                <a href="login.html">J'ai déjà un compte, je me connecte</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const is_superuser = 0; // Valeur par défaut (modifiable selon besoin)

            const messageBox = document.getElementById('message');
            messageBox.classList.add('d-none');

            if (!username || !email || !password) {
                messageBox.textContent = "Tous les champs sont obligatoires.";
                messageBox.classList.remove('d-none');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password, is_superuser })
                });

                const data = await response.json();

                if (response.ok) {
                    // Inscription réussie
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html'; // Redirection après succès
                } else {
                    messageBox.textContent = data.message || 'Erreur lors de l’inscription.';
                    messageBox.classList.remove('d-none');
                }
            } catch (error) {
                messageBox.textContent = 'Erreur de connexion au serveur.';
                messageBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
