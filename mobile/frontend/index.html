<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liste des Matchs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: white;
    }
  </style>
</head>
<body>
  <body>
  <div id="navbar-container"></div>

  <div class="container" style="margin-top: 50px;">
    <h2 class="text-white mb-4">Liste des Matchs</h2>
    <div id="error" class="alert alert-danger d-none"></div>
    <div class="row gy-4" id="matchList"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const errorBox = document.getElementById('error');
    const matchList = document.getElementById('matchList');

    if (!token) {
      window.location.href = 'login.html';
    } else {
      fetch('http://localhost:3000/events', {
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        }
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Token invalide ou expiré');
        }
        return response.json();
      })
      .then(matches => {
        if (!Array.isArray(matches) || matches.length === 0) {
          matchList.innerHTML = '<div class="text-white">Aucun match disponible.</div>';
          return;
        }

        matches.forEach(match => {
          const stadium = match.stadium || 'Stade inconnu';
          const start = match.start ? new Date(match.start).toLocaleString('fr-FR') : 'Date/heure inconnue';
          const teamHome = match.team_home || 'Équipe 1';
          const teamAway = match.team_away || 'Équipe 2';
          const score = match.score ?? null;

          const col = document.createElement('div');
          col.className = 'col-md-6';
          col.innerHTML = `
            <div class="d-flex bg-dark text-white rounded-4 border border-light p-3 justify-content-between align-items-center" style="position: relative;">
              <div class="w-100 pe-4">
                <div class="d-flex justify-content-between mb-2">
                  <div class="border rounded p-2">${stadium}</div>
                  <div class="border rounded p-2">${start}</div>
                </div>
                <div class="d-flex justify-content-between">
                  <div class="border rounded p-2">${teamHome} vs ${teamAway}</div>
                  <div class="border rounded p-2">${score ?? '-'}</div>
                </div>
              </div>
              ${score === null ? `
                <div class="bg-primary text-white px-3 py-2 rounded-end-4 text-center" style="writing-mode: vertical-rl; transform: rotate(180deg);">
                  <a href="acheter_ticket.html?event_id=${match.id}" class="text-white text-decoration-none">Acheter le ticket</a>
                </div>
              ` : ''}
            </div>
          `;
          matchList.appendChild(col);
        });
      })
      .catch(err => {
        errorBox.textContent = err.message || 'Erreur de chargement.';
        errorBox.classList.remove('d-none');
        setTimeout(() => window.location.href = 'login.html', 2000);
      });
    }

    fetch('./../include/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
  
        // Logique utilisateur après l'injection de la navbar
        const user = localStorage.getItem('user');
        const navbar = document.getElementById('navbar-items');
  
        if (user && navbar) {
          navbar.innerHTML = `
            <li class="nav-item">
              <a class="nav-link" href="#">Bienvenue, ${user} !</a>
            </li>
            <li class="nav-item">
              <a class="nav-link btn custom-btn-night text-white ms-2" href="mes_tickets.html">Mes tickets</a>
            </li>
            <li class="nav-item">
              <a class="nav-link btn btn-danger text-white ms-2" href="#" id="logout">Déconnexion</a>
            </li>
          `;
  
          document.getElementById('logout').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'login.html';
          });
        } else if (navbar) {
          navbar.innerHTML = `
            <li class="nav-item">
              <a class="nav-link" href="login.html">Connectez-vous pour accéder aux informations</a>
            </li>
          `;
        }
      });
  </script>
  
</body>
</html>
