<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mon Site</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: rgb(26, 27, 29);
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1030;
    }

    .navbar-brand img {
      width: 100px;
      height: auto;
      object-fit: contain;
    }

    .custom-btn-night {
      background-color: rgba(13, 27, 42, 0);
      border: none;
      transition: background-color 0.3s ease;
    }

    .custom-btn-night:hover,
    .custom-btn-night:active {
      background-color: rgb(13, 27, 42);
    }

    @media (max-width: 767px) {
      .navbar-brand img {
        width: 80px;
      }

      .navbar-nav {
        text-align: center;
      }

      .navbar-nav .nav-item {
        margin-bottom: 10px;
      }
    }

    @media (max-width: 576px) {
      .navbar-brand img {
        width: 70px;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <img src="https://www.selestat.fr/fileadmin/_processed_/4/f/csm_Paris-2024-Logo_ccfe1e7b67.png" alt="logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto" id="navbar-items"></ul>
        </div>
      </div>
    </nav>
  </header>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    const navbar = document.getElementById('navbar-items');

    if (user) {
      navbar.innerHTML = `
        <li class="nav-item">
          <a class="nav-link" href="#">Bienvenue, ${user.username} !</a>
        </li>
        <li class="nav-item">
          <a class="nav-link btn custom-btn-night text-white ms-2" href="mes_tickets.html">Mes tickets</a>
        </li>
        <li class="nav-item">
          <a class="nav-link btn btn-danger text-white ms-2" href="logout.html" id="logout">Déconnexion</a>
        </li>
      `;

      document.getElementById('logout').addEventListener('click', () => {
        localStorage.removeItem('user');
        localStorage.removeItem('token');
        localStorage.removeItem('user_id');
        window.location.href = 'login.html';
      });
    } else {
      navbar.innerHTML = `
        <li class="nav-item">
          <a class="nav-link" href="login.html">Connectez-vous pour accéder aux informations</a>
        </li>
      `;
    }
  </script>
</body>
</html>
